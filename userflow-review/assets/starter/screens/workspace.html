<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Example workspace</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#171717;font:16px system-ui}
header{padding:24px;border-bottom:1px solid #ddd}main{max-width:900px;margin:auto;padding:32px}
h1{margin:0 0 24px;font-size:24px}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
article{padding:24px;background:white;border:1px solid #ddd;border-radius:12px}
label{display:block;margin-bottom:8px}input{width:100%;padding:12px;border:1px solid #aaa;border-radius:8px;font:inherit}
@media(max-width:600px){main{padding:24px}.items{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>Example workspace</header>
<main>
<h1>Your projects</h1>
<div class="items"><article>Alpha</article><article>Beta</article><article>
<label for="name">New project name</label><input id="name" placeholder="Draft name">
</article></div>
</main>
</body>
</html>
